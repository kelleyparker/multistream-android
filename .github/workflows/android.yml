name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Platform rules (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests without the Android SDK
        run: ./gradlew -PcoreOnly :core:test --stacktrace

  app:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint, unit + screenshot tests, debug APK
        run: ./gradlew :core:test :app:lintDebug :app:recordRoborazziDebug :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/outputs/roborazzi/
          if-no-files-found: ignore
      - name: Publish screenshots to the screenshots branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -e
          out=$(mktemp -d)
          cp app/build/outputs/roborazzi/*.png "$out"/
          {
            echo "# Screenshots"
            echo
            echo "Rendered by CI from commit ${GITHUB_SHA}."
            echo
            for f in $(ls "$out" | grep '\.png$' | sort); do echo "### ${f%.png}"; echo; echo "![${f%.png}]($f)"; echo; done
          } > "$out/README.md"
          cd "$out"
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" screenshots
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            core/build/reports/
          if-no-files-found: ignore
